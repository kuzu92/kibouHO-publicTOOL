<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎭 役職自動割り当てツール</title>
    <!-- ブラウザを爆速にする内蔵スタイルを定義 -->
    <style>
        body { font-family: sans-serif; background-color: #f3f4f6; color: #1f2937; padding: 2rem 1rem; }
        .container { max-width: 44rem; margin: 0 auto; background: white; padding: 1.5rem; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 1.5rem; font-weight: bold; margin-bottom: 1.5rem; }
        .mb-6 { margin-bottom: 1.5rem; }
        .font-bold { font-weight: bold; }
        select, textarea { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.375rem; margin-top: 0.5rem; box-sizing: border-box; }
        textarea { font-family: monospace; font-size: 0.875rem; }
        .h-28 { height: 7rem; }
        .h-48 { height: 12rem; }
        .btn { display: block; width: auto; margin: 1.5rem auto; background-color: #059669; color: white; font-weight: bold; padding: 0.75rem 2rem; border-radius: 9999px; border: none; cursor: pointer; font-size: 1.125rem; }
        .btn:hover { background-color: #047857; }
        .hidden { display: none !important; }
        .error { background-color: #fee2e2; border-left: 4px solid #ef4444; color: #b91c1c; padding: 1rem; margin-bottom: 1.5rem; border-radius: 0.375rem; white-space: pre-line; }
        .info { background-color: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 0.75rem; margin-bottom: 1rem; border-radius: 0.375rem; font-size: 0.875rem; font-weight: 500; }
        h2 { font-size: 1.25rem; font-weight: bold; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { border: 1px solid #d1d5db; padding: 0.5rem 1rem; text-align: left; }
        th { background-color: #e5e7eb; }
        tr:hover { background-color: #f9fafb; }
        .text-blue { color: #2563eb; font-weight: bold; }
        .text-red { color: #dc2626; font-weight: bold; }
        .text-xs { font-size: 0.75rem; color: #6b7280; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 役職自動割り当てツール</h1>

        <!-- 1. モード選択 -->
        <div class="mb-6">
            <label class="font-bold">1. 割り当てモードを選択してください</label>
            <br>
            <select id="mode">
                <option value="fairness_first">ワースト回避モード（全員の不満度を最小化・要人数一致）</option>
                <option value="satisfaction_first">第1希望最優先モード（上位希望の当選数を最大化）</option>
            </select>
            <small><small>※第1希望最優先モードは上位希望から平等にランダムで決定します。それより下の希望順位は考慮しません。</small></small>
        </div>

        <!-- 2. 定員入力 -->
        <div class="mb-6">
            <label class="font-bold">2. 各役職の定員 (役職名: 定員)</label>
            <br>
            <textarea id="roles" class="h-28" rows="4">
HO1: 1
HO2: 1
HO3: 1
HO4: 1
            </textarea>
        </div>

        <!-- 3. 希望順位入力 -->
        <div class="mb-6">
            <label class="font-bold">3. メンバーの希望順位 (名前: {役職: 順位, ...})</label><br>
            <small><small>※同順位希望が複数役職に書かれていても問題ありません。</small></small>
            <br>
            <textarea id="preferences" class="h-48" rows="6">
Member1: {HO1: 2, HO2: 2, HO3: 1, HO4: 1}
Member2: {HO1: 1, HO2: 3, HO3: 3, HO4: 2}
Member3: {HO1: 2, HO2: 1, HO3: 3, HO4: 1}
Member4: {HO1: 2, HO2: 1, HO3: 1, HO4: 3}
            </textarea>
        </div>

        <!-- 実行ボタン -->
        <button onclick="executeAssignment()" class="btn">
            🚀 自動割り当てを実行する
        </button>

        <!-- 結果・エラー表示エリア -->
        <div id="error-box" class="hidden error"></div>
        <div id="result-box" class="hidden"></div>
    </div>
    <script>
        function parseRolesYAML(text) {
            const obj = {};
            const lines = text.split('\n');
            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#')) continue;
                const parts = line.split(':');
                if (parts.length >= 2) {
                    const key = parts[0].trim();
                    const val = parseInt(parts[1].trim(), 10);
                    if (key && !isNaN(val)) obj[key] = val;
                }
            }
            return obj;
        }

        function parsePreferencesYAML(text) {
            const obj = {};
            const lines = text.split('\n');
            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('#')) continue;
                
                const colonIdx = line.indexOf(':');
                if (colonIdx === -1) continue;
                
                const name = line.substring(0, colonIdx).trim();
                let braceContent = line.substring(colonIdx + 1).trim();
                
                braceContent = braceContent.replace(/[\{\}]/g, '');
                
                obj[name] = {};
                const pairs = braceContent.split(',');
                for (let pair of pairs) {
                    const pParts = pair.split(':');
                    if (pParts.length >= 2) {
                        const role = pParts[0].trim();
                        const rank = parseInt(pParts[1].trim(), 10);
                        if (role && !isNaN(rank)) obj[name][role] = rank;
                    }
                }
            }
            return obj;
        }

        function permute(arr) {
            const result = [];
            const permuteInner = (arr, m = []) => {
                if (arr.length === 0) {
                    result.push(m);
                } else {
                    const seen = new Set();
                    for (let i = 0; i < arr.length; i++) {
                        if (seen.has(arr[i])) continue;
                        seen.add(arr[i]);
                        let curr = arr.slice();
                        let next = curr.splice(i, 1);
                        permuteInner(curr.slice(), m.concat(next));
                    }
                }
            }
            permuteInner(arr);
            return result;
        }
        function executeAssignment() {
            const errorBox = document.getElementById('error-box');
            const resultBox = document.getElementById('result-box');
            
            // 実行ごとに表示と中身を完全にリセット
            errorBox.classList.add('hidden');
            errorBox.innerText = '';
            resultBox.classList.add('hidden');
            resultBox.innerHTML = '';

            const mode = document.getElementById('mode').value;
            const roles = parseRolesYAML(document.getElementById('roles').value);
            const preferences = parsePreferencesYAML(document.getElementById('preferences').value);

            if (Object.keys(roles).length === 0 || Object.keys(preferences).length === 0) {
                errorBox.innerText = "❌ エラー: データの読み込みに失敗しました。\n入力フォームのフォーマット（コロンや改行、波カッコ）を確認してください。";
                errorBox.classList.remove('hidden');
                return;
            }

            const members = Object.keys(preferences);
            let flatRoles = [];
            let totalSlots = 0;
            for (let [role, count] of Object.entries(roles)) {
                totalSlots += count;
                for (let i = 0; i < count; i++) flatRoles.push(role);
            }

            if (mode === "fairness_first" && members.length !== totalSlots) {
                errorBox.innerText = `❌ エラー: 総定員数とメンバーの人数が一致していません\n現在、総定員数は ${totalSlots}人、メンバー数は ${members.length}人 です。\n\nワースト回避モードを動かすには、人数と定員を完全に一致させてください。一致しない場合は「第1希望最優先モード」に切り替えてください。`;
                errorBox.classList.remove('hidden');
                return;
            }

            let results = {};
            let bestPatterns = [];

            if (mode === "fairness_first") {
                const patterns = permute(flatRoles);
                let minMaxPenalty = Infinity;
                let minTotalPenalty = Infinity;

                for (let p of patterns) {
                    let currentMaxPenalty = 0;
                    let currentTotalPenalty = 0;
                    let currentPattern = {};

                    for (let i = 0; i < members.length; i++) {
                        const member = members[i];
                        const role = p[i];
                        const rank = preferences[member][role] !== undefined ? preferences[member][role] : 99;
                        currentPattern[member] = { role, rank, isOut: rank === 99 };

                        const penalty = rank === 99 ? 10000 : Math.pow(rank, 4);
                        currentTotalPenalty += penalty;
                        if (penalty > currentMaxPenalty) currentMaxPenalty = penalty;
                    }

                    const isNewMinMax = (currentMaxPenalty !== minMaxPenalty && currentMaxPenalty === Math.min(currentMaxPenalty, minMaxPenalty));
                    if (isNewMinMax) {
                        minMaxPenalty = currentMaxPenalty;
                        minTotalPenalty = currentTotalPenalty;
                        bestPatterns = [currentPattern];
                    } else if (currentMaxPenalty === minMaxPenalty) {
                        const isNewMinTotal = (currentTotalPenalty !== minTotalPenalty && currentTotalPenalty === Math.min(currentTotalPenalty, minTotalPenalty));
                        if (isNewMinTotal) {
                            minTotalPenalty = currentTotalPenalty;
                            bestPatterns = [currentPattern];
                        } else if (currentTotalPenalty === minTotalPenalty) {
                            bestPatterns.push(currentPattern);
                        }
                    }
                }
            }
            else {
                let remainingRoles = Object.assign({}, roles);
                let assignments = {};
                members.forEach(m => assignments[m] = null);

                let maxRank = 1;
                members.forEach(m => {
                    Object.values(preferences[m]).forEach(r => {
                        const isLarger = (r !== maxRank && r === Math.max(r, maxRank));
                        if (isLarger) maxRank = r;
                    });
                });

                let rank = 1;
                while (rank <= maxRank) {
                    let roleDemands = {};
                    Object.keys(roles).forEach(r => roleDemands[r] = []);

                    members.forEach(member => {
                        if (assignments[member] !== null) return;
                        Object.entries(preferences[member]).forEach(([role, r]) => {
                            if (r === rank && roleDemands[role] !== undefined) roleDemands[role].push(member);
                        });
                    });

                    let activeRoles = Object.keys(roles).filter(r => remainingRoles[r] !== 0 && roleDemands[r].length !== 0);
                    activeRoles.sort((a, b) => (roleDemands[b].length / remainingRoles[b]) - (roleDemands[a].length / remainingRoles[a]));

                    activeRoles.forEach(role => {
                        let validCandidates = roleDemands[role].filter(c => assignments[c] === null);
                        validCandidates.sort(() => Math.random() - 0.5);
                        let available = remainingRoles[role];
                        let chosen = validCandidates.slice(0, available);

                        chosen.forEach(member => {
                            assignments[member] = { role, rank, isOut: false };
                            remainingRoles[role]--;
                        });
                    });
                    rank += 1;
                }

                let unassigned = members.filter(m => assignments[m] === null);
                let unfilled = Object.keys(remainingRoles).filter(r => remainingRoles[r] !== 0);
                unassigned.forEach(member => {
                    if (unfilled.length !== 0) {
                        let spareRole = unfilled[0];
                        assignments[member] = { role: spareRole, rank: null, isOut: true };
                        remainingRoles[spareRole]--;
                        if (remainingRoles[spareRole] === 0) unfilled.shift();
                    }
                });

                results = assignments;
            }
            // --- 結果の出力処理 ---
            const resultTitle = document.createElement('h2');
            resultTitle.innerText = "📊 割り当て結果";
            resultBox.appendChild(resultTitle);

            const resultInfo = document.createElement('div');
            resultInfo.className = "info";
            const patternCount = (mode === "fairness_first") ? bestPatterns.length : 1;
            resultInfo.innerText = `💡 条件を最もよく満たす組み合わせが ${patternCount} 通り見つかりました。`;
            resultBox.appendChild(resultInfo);

            const tableWrapper = document.createElement('div');
            tableWrapper.style.overflowX = "auto";
            const newTable = document.createElement('table');
            newTable.innerHTML = `<thead><tr><th>名前</th><th>割り当て役職</th></tr></thead>`;
            const newTableBody = document.createElement('tbody');
            newTable.appendChild(newTableBody);
            tableWrapper.appendChild(newTable);
            resultBox.appendChild(tableWrapper);

            const displayPatterns = (mode === "fairness_first") ? bestPatterns : [results];

            displayPatterns.forEach((pattern, index) => {
                if (patternCount > 1) {
                    const patternHeader = document.createElement('tr');
                    patternHeader.style.backgroundColor = "#f3f4f6";
                    patternHeader.style.fontWeight = "bold";
                    patternHeader.innerHTML = `<td colspan="2" style="text-align: center;">【パターン ${index + 1}】</td>`;
                    newTableBody.appendChild(patternHeader);
                }

                for (let [name, res] of Object.entries(pattern)) {
                    if (!res) continue;
                    const tr = document.createElement('tr');
                    
                    const tdName = document.createElement('td');
                    tdName.style.fontWeight = "500";
                    tdName.style.width = "50%";
                    tdName.innerText = name;

                    const tdRole = document.createElement('td');
                    tdRole.style.width = "50%";
                    if (res.isOut) {
                        tdRole.innerHTML = `<span class="text-red">${res.role}</span> <span class="text-xs">(希望外分配)</span>`;
                    } else {
                        tdRole.innerHTML = `<span class="text-blue">${res.role}</span> <span class="text-xs">(${res.rank}希望)</span>`;
                    }

                    tr.appendChild(tdName);
                    tr.appendChild(tdRole);
                    newTableBody.appendChild(tr);
                }

                const isNotLast = (index !== patternCount - 1 && index === Math.min(index, patternCount - 1));
                if (patternCount > 1 && isNotLast) {
                    const spacer = document.createElement('tr');
                    spacer.innerHTML = '<td colspan="2" style="border: none; padding: 0.5rem 0;"></td>';
                    newTableBody.appendChild(spacer);
                }
            });

            resultBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
